<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Kitchen">
<title>My Kitchen</title>
<meta name="description" content="Turn recipes you love into recipes that work for you.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main"></main>
<nav class="tabbar" aria-label="Main"><div class="tabbar-in">
<button class="tab" data-act="tab" data-s="home">ICON_HOME<span>Home</span></button>
<button class="tab" data-act="tab" data-s="recipes">ICON_BOOK<span>Recipes</span></button>
<button class="tab tab-add" data-act="tab" data-s="add" aria-label="Add a recipe"><span class="plus">ICON_PLUS</span><span>Add</span></button>
<button class="tab" data-act="tab" data-s="kitchen">ICON_WHISK<span>Test Kitchen</span></button>
<button class="tab" data-act="tab" data-s="profile">ICON_USER<span>Profile</span></button>
</div></nav>
<input type="file" id="file-cam" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="file-img" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="file-multi" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="file-json" accept=".json,application/json,text/plain" class="sr" tabindex="-1" aria-hidden="true">
<datalist id="units"><option>g</option><option>kg</option><option>ml</option><option>dl</option><option>l</option><option>tsp</option><option>tbsp</option><option>cup</option><option>cups</option><option>oz</option><option>pinch</option><option>pcs</option></datalist>
<div id="print-root"></div>
<script src="core.js"></script>
<script src="service.js"></script>
<script src="screens.js"></script>
<script src="actions.js"></script>
</body>
</html>
